<!doctype html>
<html>
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Studio spike S1</title>
<style>
  html, body { margin: 0; height: 100%; background: #1d1d1d; color: #d6d6d6; font: 12px/1.4 system-ui, sans-serif; overflow: hidden; }
  #root { display: grid; grid-template-columns: 180px 1fr; height: 100%; }
  #outliner { background: #282828; border-right: 1px solid #111; padding: 6px; overflow: auto; }
  #outliner .row { padding: 3px 6px; border-radius: 3px; cursor: pointer; }
  #outliner .row.sel { background: #4772b3; color: #fff; }
  #view { position: relative; min-width: 0; }
  #view canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
  #diag { position: absolute; top: 6px; right: 6px; background: #000b; padding: 6px 8px; border-radius: 4px; white-space: pre; font: 11px/1.35 ui-monospace, monospace; pointer-events: none; max-width: 60%; overflow: hidden; }
  #bar { position: absolute; left: 6px; top: 6px; display: flex; gap: 4px; }
  #bar button { background: #3c3c3c; color: #ddd; border: 1px solid #111; border-radius: 3px; padding: 3px 8px; cursor: pointer; }
  #bar button.on { background: #4772b3; color: #fff; }
</style>
</head>
<body>
<div id="root"><div id="outliner"></div><div id="view"><div id="bar"></div><pre id="diag"></pre></div></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
