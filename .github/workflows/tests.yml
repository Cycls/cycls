name: Tests

on:
  push:
    branches:
      - main
      - feat/agent-design
      - feat/agent-video
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --group test

      - name: Run tests
        run: uv run pytest tests/ -v

  e2e:
    # Cycls and the design editor in a real browser (tests/e2e): a local server with
    # the built client, the deployed editor, Chromium — where the bugs found by hand
    # lived, between the two.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --group test

      - name: Install Chromium
        run: uv run playwright install --with-deps chromium

      - name: Run the real-browser tests
        run: uv run pytest tests/e2e --e2e -v

  client:
    # The web client (vitest): useChat, auth headers, the editor bridge view, …
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: The committed bundle is built from these sources
        run: node scripts/src-hash.mjs --check ../cycls/_agent/web/themes/default/index.html
